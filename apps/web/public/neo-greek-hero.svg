<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">PaperMaxing neo-Greek research hero</title>
  <desc id="desc">A bright parchment colonnade with classical columns, luminous research nodes, and abstract code fragments.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="0.55" stop-color="#f5efe1"/><stop offset="1" stop-color="#eee2cb"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="58%"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".55" stop-color="#f7f0df" stop-opacity=".72"/><stop offset="1" stop-color="#d9c5a0" stop-opacity="0"/></radialGradient>
